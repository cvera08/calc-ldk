# Tests run on every push and every pull request, against the exact folder
# that would go live. The site is only deployed when they pass, and only
# from master.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

# One deployment at a time. Queued rather than cancelled, so a run that
# is already publishing is never left half finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: tests (iphone + samsung)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # Publish only what the browser needs. The readme, the tests and this
      # workflow stay in the repository.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest _site/
          cp -R icons _site/
          cp -R js _site/

      # The suites run against _site, so a file that was never copied in
      # fails here instead of on the live site.
      - name: Run the suites
        env:
          SITE_ROOT: _site
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: deploy to github pages
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/configure-pages@v5

      - id: deployment
        uses: actions/deploy-pages@v4
