# Publishes the calculator to GitHub Pages on every push to master.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it needs.
permissions:
  contents: read

# One deployment at a time. Queued rather than cancelled, so a run that
# is already publishing is never left half finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to github pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5

      # Publish only what the browser needs. The readme and this workflow
      # stay in the repository.
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R js _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
